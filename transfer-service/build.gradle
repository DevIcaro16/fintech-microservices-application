plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.0'
    id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.fintech'
version = '1.0.0'
sourceCompatibility = '21'

repositories {
    mavenCentral()
}

configurations.all {
    resolutionStrategy {
        force 'com.github.docker-java:docker-java-api:3.4.1'
        force 'com.github.docker-java:docker-java-core:3.4.1'
        force 'com.github.docker-java:docker-java-transport:3.4.1'
        force 'com.github.docker-java:docker-java-transport-zerodep:3.4.1'
        force 'com.github.docker-java:docker-java-transport-httpclient5:3.4.1'
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.postgresql:r2dbc-postgresql:1.0.5.RELEASE'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'software.amazon.awssdk:dynamodb:2.25.67'
    implementation 'software.amazon.awssdk:netty-nio-client:2.25.67'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.testcontainers:testcontainers:1.20.6'
    testImplementation 'org.testcontainers:postgresql:1.20.6'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.6'
    testImplementation 'org.postgresql:postgresql:42.7.3'
}

test {
    useJUnitPlatform()
    systemProperty 'api.version', '1.44'
    environment 'TESTCONTAINERS_RYUK_DISABLED', 'true'
}
