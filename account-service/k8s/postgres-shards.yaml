apiVersion: v1
kind: Secret
metadata:
  name: account-postgres-secret
  namespace: fintech
type: Opaque
stringData:
  username: accountuser
  password: accountpass
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: account-migrations
  namespace: fintech
data:
  V1__init.sql: |
    CREATE TABLE IF NOT EXISTS accounts (
        id VARCHAR(36) PRIMARY KEY,
        owner_id VARCHAR(36) NOT NULL,
        balance NUMERIC(19,2) NOT NULL DEFAULT 0,
        created_at TIMESTAMPTZ DEFAULT NOW()
    );
    CREATE TABLE IF NOT EXISTS transfer_idempotency (
        account_id VARCHAR(36) NOT NULL,
        transfer_id VARCHAR(36) NOT NULL,
        created_at TIMESTAMPTZ DEFAULT NOW(),
        PRIMARY KEY (account_id, transfer_id)
    );
    CREATE TABLE IF NOT EXISTS outbox (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        aggregate_id VARCHAR NOT NULL,
        event_type VARCHAR NOT NULL,
        payload TEXT NOT NULL,
        published BOOLEAN DEFAULT FALSE,
        created_at TIMESTAMPTZ DEFAULT NOW()
    );
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: account-postgres-shard0
  namespace: fintech
spec:
  serviceName: account-postgres-shard0
  replicas: 1
  selector:
    matchLabels:
      app: account-postgres-shard0
  template:
    metadata:
      labels:
        app: account-postgres-shard0
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: accountdb
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: account-postgres-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: account-postgres-secret
                  key: password
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: migrations
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: data
          emptyDir: {}
        - name: migrations
          configMap:
            name: account-migrations
---
apiVersion: v1
kind: Service
metadata:
  name: account-postgres-shard0
  namespace: fintech
spec:
  clusterIP: None
  selector:
    app: account-postgres-shard0
  ports:
    - port: 5432
---
