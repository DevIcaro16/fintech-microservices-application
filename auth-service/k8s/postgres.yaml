apiVersion: v1
kind: Secret
metadata:
  name: auth-postgres-secret
  namespace: fintech
type: Opaque
stringData:
  username: authuser
  password: authpass123
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-migrations
  namespace: fintech
data:
  001_init.sql: |
    CREATE EXTENSION IF NOT EXISTS "pgcrypto";
    CREATE TABLE IF NOT EXISTS users (
        id            UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        email         VARCHAR(255) UNIQUE NOT NULL,
        password_hash VARCHAR(255) NOT NULL,
        created_at    TIMESTAMPTZ DEFAULT NOW()
    );
    CREATE TABLE IF NOT EXISTS outbox (
        id           UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        aggregate_id VARCHAR NOT NULL,
        event_type   VARCHAR NOT NULL,
        payload      JSONB   NOT NULL,
        published    BOOLEAN DEFAULT FALSE,
        created_at   TIMESTAMPTZ DEFAULT NOW()
    );
    CREATE INDEX IF NOT EXISTS idx_outbox_published ON outbox(published) WHERE published = FALSE;
    CREATE INDEX IF NOT EXISTS idx_users_email ON users(email);
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: auth-postgres
  namespace: fintech
spec:
  serviceName: auth-postgres
  replicas: 1
  selector:
    matchLabels:
      app: auth-postgres
  template:
    metadata:
      labels:
        app: auth-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: authdb
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: auth-postgres-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-postgres-secret
                  key: password
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: migrations
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
      volumes:
        - name: data
          emptyDir: {}
        - name: migrations
          configMap:
            name: auth-migrations
---
apiVersion: v1
kind: Service
metadata:
  name: auth-postgres
  namespace: fintech
spec:
  clusterIP: None
  selector:
    app: auth-postgres
  ports:
    - port: 5432
